[project]
name = "llm-bench"
version = "0.1.0"
description = "Pytest suite and load benchmark for OpenAI-compatible LLM endpoints"
readme = "README.md"
authors = [
    { name = "Daniel Kasperovich", email = "72548485+uproot9608@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
llm-bench = "llm_bench:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
